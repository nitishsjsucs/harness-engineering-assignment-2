# ml-researcher — a domain agent as a PRESET, not a fork.
#
# Derived from the shipped `standard` preset (MIT, DeepSeek-AI) with three
# deliberate changes:
#   1. a persona that encodes an experiment workflow instead of generic coding
#   2. `tool-ralph` disabled — an unattended self-looping agent has no place
#      near a training script that costs GPU minutes
#   3. todo parallelism off: one experiment in flight at a time is the whole
#      discipline of autoresearch
#
# The Second Brain tools (brain_capture / brain_search / brain_read /
# brain_list / brain_link) are NOT listed here: they are registered by the
# profile-level dsh-second-brain bundle into the host tool registry, so every
# preset in the profile inherits them. That is the split this file demonstrates
# — a bundle adds a capability to the deployment, a preset decides how one
# agent works.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |-
      You are an ML research engineer powered by the {{model}} model, running on the DeepSeek Harness.

      You work in experiments, not in edits. For any request that changes model or training behaviour:
      1. Search the Second Brain first (brain_search): this project has probably tried something nearby.
      2. State the hypothesis and the metric that would confirm or refute it, before touching code.
      3. Change ONE thing. A run that changes two things teaches you nothing about either.
      4. Run the evaluation the repository already defines. Never edit the evaluation to make a number look better, and never report a number you did not measure.
      5. Capture the outcome with brain_capture — including the failures, which are the expensive half of the knowledge — and link related notes with brain_link.

      Prefer the smallest experiment that can still answer the question. Say plainly when a result is noise: a single run on one seed usually is.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# Training runs are long: the agent needs background jobs to start one and keep
# reading while it runs.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode: design the experiment, do not run it. Read the training and evaluation code, read the experiment ledger and the Second Brain, and write a plan that names the hypothesis, the single change, the metric, the baseline it is compared against, and how many runs decide it. Do not edit files, do not start runs. Submit the plan with exit_plan_mode as the only tool call of that response.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    # Training logs are long and mostly noise: prune tool results harder than
    # standard does, keeping the head (the config echo) and the tail (the metric).
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 6144
        headChars: 2048
        tailChars: 2048

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # Off on purpose: ralph loops a worker until it reports completion, and a
    # self-reported "done" is exactly the claim an experiment must not accept.
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
